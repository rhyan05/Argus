[project]
name = "argus-av"
version = "0.2.0"
description = "Argus — scanner antivírus/malware local, CLI-first, com frontend local complementar"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rhyan Lemos Silveira" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["antivirus", "malware", "scanner", "yara", "clamav", "virustotal", "security", "cli", "argus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "rich",
    "pefile",
    "oletools",
    "py7zr",
    "cryptography",
]
# yara-python fica de fora: sem wheel para 3.14 e exige compilador C.
# Alternativa sem compilador: winget install VirusTotal.YARA (usada via CLI).

[project.optional-dependencies]
gui = ["pywebview"]
dev = ["ruff", "pytest", "build", "twine", "python-dotenv"]

[project.scripts]
argus = "argus_av.cli:main"

[project.urls]
Homepage = "https://github.com/rhyan05/Argus"
Repository = "https://github.com/rhyan05/Argus"
Issues = "https://github.com/rhyan05/Argus/issues"
Frontend = "https://github.com/rhyan05/argus-front"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["argus_av"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # comprimento de linha é do formatter, não do linter

[tool.pytest.ini_options]
testpaths = ["tests"]
